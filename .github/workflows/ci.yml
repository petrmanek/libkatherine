name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # The tree is formatted with clang-format 22 and .clang-format uses
      # keys unknown to older releases, so the runner's system formatter
      # cannot be relied on; pin the version the check is meaningful for.
      - name: Install clang-format
        run: |
          pip install 'clang-format==22.*'
          clang-format --version
      - name: Check formatting
        run: git ls-files '*.c' '*.h' '*.cpp' '*.hpp' | xargs clang-format --dry-run --Werror

  build:
    name: build (${{ matrix.os }}${{ matrix.compiler && format(', {0}', matrix.compiler) || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            python: true
          - os: ubuntu-latest
            compiler: clang
          - os: macos-latest
          - os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cython
        if: matrix.python
        run: pip install Cython

      - name: Set compiler
        if: matrix.compiler
        run: |
          echo "CC=${{ matrix.compiler }}" >> "$GITHUB_ENV"
          echo "CXX=${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}" >> "$GITHUB_ENV"

      # macOS configures only 127.0.0.1 on loopback; the end-to-end tests
      # host the emulated readout on a secondary address, so alias it.
      # Linux routes all of 127/8 to loopback and needs nothing.
      - name: Alias the emulator loopback address
        if: runner.os == 'macOS'
        run: sudo ifconfig lo0 alias 127.0.0.2 up

      # The USB transport is only built where libusb is, so a job without it
      # compiles none of c/src/transport/transport_usb.c and runs none of its
      # tests. Installed here rather than left to auto-detection so that a
      # runner image dropping the package shows up as a configure failure
      # instead of as silently reduced coverage.
      - name: Install libusb
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0-dev

      - name: Install libusb
        if: runner.os == 'macOS'
        run: brew install libusb

      # No package manager carries it on the runner, so the project's own
      # Windows release is unpacked and pointed at, which is what
      # KatherineLibusb.cmake's LIBUSB_ROOT fallback exists for. The same
      # shape raspberrypi/picotool uses.
      - name: Install libusb
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          curl.exe -L -o libusb.7z https://github.com/libusb/libusb/releases/download/v1.0.27/libusb-1.0.27.7z
          7z x libusb.7z -olibusb
          "LIBUSB_ROOT=$(Join-Path (Get-Location) libusb)" >> $env:GITHUB_ENV

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DKATHERINE_BUILD_CXX=ON
          -DKATHERINE_BUILD_EXAMPLES=ON
          -DKATHERINE_BUILD_PYTHON=${{ matrix.python && 'ON' || 'OFF' }}
          -DKATHERINE_TRANSPORT_USB=ON

      - name: Build
        # --config is required by multi-config generators (Visual Studio on
        # the Windows runner); single-config generators ignore it.
        run: cmake --build build --parallel --config Release

      # Tests land in an upcoming commit; run ctest only once the build
      # tree actually registers tests.
      - name: Test
        if: ${{ hashFiles('build/CTestTestfile.cmake') != '' }}
        run: ctest --test-dir build --output-on-failure -C Release --timeout 300

      # Observation mode: the results are printed into the run log so that
      # tolerances can be calibrated from real runner data before any gate
      # is armed -- shared runners differ widely across hardware
      # generations, so a gate carried over from one machine would only
      # train everyone to ignore red. The ctest entries above already smoke
      # the benchmarks; this runs them at their full measurement duration.
      - name: Benchmark (observation)
        if: ${{ hashFiles('build/CTestTestfile.cmake') != '' }}
        shell: bash
        run: |
          for b in bench_decode bench_udp; do
            bin=$(find build \( -name "$b" -o -name "$b.exe" \) -type f | head -1)
            "$bin"
          done

  # Every job above builds both transports at once, so nothing has checked
  # that either one can be turned off -- the CMake gating, the
  # KATHERINE_FEATURE_* macros, and the #ifdefs around each transport's
  # sources. Windows is in the matrix for the one thing Linux cannot show:
  # ws2_32 is linked only where the UDP transport is built, so a USB-only
  # Windows build is the only configuration in which a stray winsock call
  # fails to link.
  #
  # The USB transport is auto-detected, so a leg that wants it off has to
  # say so; libusb is installed only where a leg wants it on.
  transports:
    name: transports (${{ matrix.os }}, ${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: UDP only
            udp: 'ON'
            usb: 'OFF'
          - os: ubuntu-latest
            name: USB only
            udp: 'OFF'
            usb: 'ON'
          - os: windows-latest
            name: UDP only
            udp: 'ON'
            usb: 'OFF'
          - os: windows-latest
            name: USB only
            udp: 'OFF'
            usb: 'ON'
    steps:
      - uses: actions/checkout@v4

      - name: Install libusb
        if: matrix.usb == 'ON' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0-dev

      # The same unpack the build job does, for the reason given there.
      - name: Install libusb
        if: matrix.usb == 'ON' && runner.os == 'Windows'
        shell: pwsh
        run: |
          curl.exe -L -o libusb.7z https://github.com/libusb/libusb/releases/download/v1.0.27/libusb-1.0.27.7z
          7z x libusb.7z -olibusb
          "LIBUSB_ROOT=$(Join-Path (Get-Location) libusb)" >> $env:GITHUB_ENV

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DKATHERINE_BUILD_CXX=ON
          -DKATHERINE_BUILD_EXAMPLES=ON
          -DKATHERINE_BUILD_PYTHON=OFF
          -DKATHERINE_TRANSPORT_UDP=${{ matrix.udp }}
          -DKATHERINE_TRANSPORT_USB=${{ matrix.usb }}

      - name: Build
        run: cmake --build build --parallel --config Release

      # A build without the UDP transport registers no tests at all: the
      # emulator, the examples and the suite each address a readout by host,
      # so all three are skipped. Same guard the build job uses.
      - name: Test
        if: ${{ hashFiles('build/CTestTestfile.cmake') != '' }}
        run: ctest --test-dir build --output-on-failure -C Release --timeout 300

  # The other half of the same property. With neither transport the library
  # would have no way to reach a readout, so the configure refuses instead of
  # producing one. A job of its own, because a leg whose configure must fail
  # cannot share steps with the ones that must succeed.
  transports-none:
    name: transports (neither)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Configure must refuse
        shell: bash
        run: |
          if cmake -B build -DKATHERINE_TRANSPORT_UDP=OFF -DKATHERINE_TRANSPORT_USB=OFF > configure.log 2>&1; then
            echo "the configure succeeded with no transport enabled"
            cat configure.log
            exit 1
          fi
          grep -q 'no transport selected' configure.log || {
            echo "the configure failed, but not on the missing transport:"
            cat configure.log
            exit 1
          }
          echo "refused, as it must"

  # Nothing built the documentation until now, so its whole configuration --
  # two doxygen runs, the manual-page prune, the macro predefines -- was
  # verified on one developer machine at one doxygen version, while the
  # declared minimum is far older and the Windows VM has no doxygen at all.
  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz libusb-1.0-0-dev

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DKATHERINE_BUILD_CXX=ON
          -DKATHERINE_BUILD_DOXYGEN=ON
          -DKATHERINE_TRANSPORT_USB=ON

      # The point of the job: the documentation has to build at all, on a
      # doxygen this project has never seen -- which is why no version is
      # pinned here, unlike the formatter.
      #
      # It must also build without a warning. The count reached 314 by
      # nobody watching it, and went back to zero over five commits in
      # October 2026; zero is only stable if something fails on one. The
      # unpinned doxygen cuts both ways: a release that adds a diagnostic
      # reddens this job for a change that did not cause it, and that is
      # the cost of finding out early rather than at the next sweep.
      # Warnings about DoxygenLayout.xml are not counted, and cannot be
      # fixed by editing it: the `properties` entries in namespace and file
      # scope are rejected by doxygen 1.9.8 as an unexpected tag and
      # required by 1.18, which reports them missing. No text of that file
      # is clean on both, and neither complaint is about this library's
      # documentation -- both versions fall back to the default layout and
      # say so. What this gate is for is the source warnings.
      - name: Build the documentation, and fail on a warning
        shell: bash
        run: |
          cmake --build build --target docs 2>&1 | tee doxygen.log
          grep 'warning:' doxygen.log | grep -v '^DoxygenLayout\.xml:' > doxygen.warnings || true
          if [ -s doxygen.warnings ]; then
            echo "doxygen emitted $(wc -l < doxygen.warnings) warning(s):"
            cat doxygen.warnings
            exit 1
          fi
          echo "doxygen is clean; $(grep -c 'warning:' doxygen.log || true) layout warning(s) ignored"

      # The manual pages must be safe to install, and that is a property
      # rather than a number, so it is worth failing on. MAN_LINKS gives every
      # documented entity a page named after it alone, struct fields included,
      # which without the prune puts an abort.3 and a read.3 into man3 to
      # shadow the libc pages of those names. Every surviving page must carry
      # the library's own prefix.
      - name: Check the manual pages are namespaced
        shell: bash
        run: |
          pages=$(ls build/docs/man/man3 | wc -l)
          if [ "$pages" -eq 0 ]; then
            echo "no manual pages were generated"
            exit 1
          fi
          stray=$(ls build/docs/man/man3 | grep -vE '^(katherine|KATHERINE)' || true)
          if [ -n "$stray" ]; then
            echo "manual pages without the library prefix, which would shadow"
            echo "system pages of the same name:"
            echo "$stray"
            exit 1
          fi
          echo "$pages pages, all namespaced"

      # Observation mode, for the reason the benchmark step below gives: the
      # warning count moves with the doxygen version, so a number calibrated
      # on one machine would fail here for a reason that is not a regression.
      # Printed so a ceiling can be set from real runner data.
      - name: Warning count (observation)
        shell: bash
        run: |
          rm -f build/docs/docs.stamp build/docs/docs-man.stamp
          cmake --build build --target docs 2>&1 | grep -c 'warning:' || true
          doxygen --version

  # The build honors -DCMAKE_C_STANDARD / -DCMAKE_CXX_STANDARD from C11 and
  # C++11 up (see "Language standards" in the README). The two extremes
  # bracket the whole range: the strict oldest dialect catches code leaning
  # on GNU extensions or newer-standard features, the newest catches
  # constructs the later standards deprecate or repurpose.
  standards:
    name: standards (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: C11 strict
            cc: gcc
            cxx: g++
            c_standard: 11
            cxx_standard: 11
            extensions: OFF
          - name: C23/C++23
            cc: clang
            cxx: clang++
            c_standard: 23
            cxx_standard: 23
            extensions: ON
          # The two above are the extremes. These two are the middle, which
          # nothing covered: a local sweep of all twenty configurations the
          # README promises passed, but CI checked two of them.
          - name: C17/C++14
            cc: gcc
            cxx: g++
            c_standard: 17
            cxx_standard: 14
            extensions: ON
          - name: C23/C++20 strict
            cc: clang
            cxx: clang++
            c_standard: 23
            cxx_standard: 20
            extensions: OFF
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4

      - name: Install libusb
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0-dev

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DKATHERINE_TRANSPORT_USB=ON
          -DCMAKE_C_STANDARD=${{ matrix.c_standard }}
          -DCMAKE_CXX_STANDARD=${{ matrix.cxx_standard }}
          -DCMAKE_C_EXTENSIONS=${{ matrix.extensions }}
          -DKATHERINE_BUILD_CXX=ON
          -DKATHERINE_BUILD_EXAMPLES=ON
          -DKATHERINE_BUILD_PYTHON=OFF

      - name: Build
        run: cmake --build build --parallel

      # The whole suite, not the unit label. The end-to-end tests are
      # compiled in these legs either way, so restricting the run saved
      # their runtime and nothing else -- while the README's claim is about
      # the full suite, and that is the claim this job exists to check.
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 300

  # Nothing ran `cmake --install` until now, so the exported package -- how a
  # consumer actually integrates -- was never exercised. It is also where a
  # real defect was found on 2026-10-25: a USB-only build silently dropped
  # the emulator it had been asked for, which only an install made visible.
  install:
    name: install and consume
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: both transports
            udp: ON
            usb: ON
          - name: UDP only
            udp: ON
            usb: OFF
          - name: USB only
            udp: OFF
            usb: ON
    steps:
      - uses: actions/checkout@v4

      - name: Install libusb
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0-dev

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/prefix
          -DKATHERINE_TRANSPORT_UDP=${{ matrix.udp }}
          -DKATHERINE_TRANSPORT_USB=${{ matrix.usb }}
          -DKATHERINE_BUILD_EMULATOR=ON
          -DKATHERINE_BUILD_CXX=ON
          -DKATHERINE_BUILD_PYTHON=OFF
          -DKATHERINE_BUILD_TESTS=OFF
          -DKATHERINE_BUILD_EXAMPLES=OFF
          -DKATHERINE_BUILD_BENCHMARKS=OFF

      - name: Build and install
        run: |
          cmake --build build --parallel
          cmake --install build

      # What a consumer is entitled to: the feature macros naming exactly the
      # transports that were built, the emulator header where its feature
      # macro says it is, and a program that compiles on pkg-config's flags.
      - name: Check what the prefix contains
        shell: bash
        run: |
          set -eu
          features=$(find "${{ github.workspace }}/prefix" -name features.h)
          echo "--- $features"; cat "$features"
          have() { grep -q "^#define $1\b" "$features"; }
          if [ "${{ matrix.udp }}" = ON ]; then have KATHERINE_FEATURE_UDP; else ! have KATHERINE_FEATURE_UDP; fi
          if [ "${{ matrix.usb }}" = ON ]; then have KATHERINE_FEATURE_USB; else ! have KATHERINE_FEATURE_USB; fi
          have KATHERINE_FEATURE_EMULATOR
          test -f "$(dirname "$features")/emulator.h"

      - name: Build a consumer against the install
        shell: bash
        run: |
          set -eu
          export PKG_CONFIG_PATH="${{ github.workspace }}/prefix/lib/pkgconfig:${{ github.workspace }}/prefix/lib64/pkgconfig"
          printf '#include <katherine/katherine.h>\n#include <stdio.h>\nint main(void){puts(katherine_strerror(KATHERINE_E_OK));return 0;}\n' > consumer.c
          cc consumer.c -o consumer $(pkg-config --cflags --libs katherine)
          LD_LIBRARY_PATH="${{ github.workspace }}/prefix/lib:${{ github.workspace }}/prefix/lib64" ./consumer

  # Every build switch off on its own, plus the pairs that have bitten. The
  # pair KATHERINE_BUILD_EMULATOR=OFF with TESTS=ON broke on 2026-10-24 with
  # 72 errors across three test files and nothing in CI built it.
  build-options:
    name: build-option shapes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install libusb
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0-dev

      - name: Configure and build each shape
        shell: bash
        run: |
          set -eu
          shapes=(
            ""
            "-DKATHERINE_BUILD_CXX=OFF"
            "-DKATHERINE_BUILD_EXAMPLES=OFF"
            "-DKATHERINE_BUILD_TESTS=OFF"
            "-DKATHERINE_BUILD_BENCHMARKS=OFF"
            "-DKATHERINE_BUILD_EMULATOR=OFF"
            "-DKATHERINE_BUILD_EMULATOR=OFF -DKATHERINE_BUILD_TESTS=ON"
            "-DKATHERINE_BUILD_CXX=OFF -DKATHERINE_BUILD_EXAMPLES=OFF"
            "-DKATHERINE_BUILD_EMULATOR=OFF -DKATHERINE_BUILD_CXX=OFF"
          )
          for i in "${!shapes[@]}"; do
            echo "::group::shape $i: ${shapes[$i]:-default}"
            rm -rf "b$i"
            # shellcheck disable=SC2086
            cmake -S . -B "b$i" -DCMAKE_BUILD_TYPE=Release ${shapes[$i]}
            cmake --build "b$i" --parallel
            echo "::endgroup::"
          done

  # Address and thread sanitizers, one job each. Both in Debug, since a
  # sanitizer's value is the report and Release's inlining costs the report
  # its stack frames.
  #
  # Worth a leg of its own rather than a flag on the build job: a sanitized
  # end-to-end run is several times slower than a plain one, and both
  # sanitizers found real defects on their first run here -- one use of
  # uninitialized memory in the decode path and one leak in the emulator
  # daemon that deadlocked the serialized test lane.
  #
  # The two cannot share a build: address and thread sanitizers are mutually
  # exclusive in both compilers.
  sanitizers:
    name: sanitizers (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: address
            flags: -fsanitize=address,undefined -fno-omit-frame-pointer
          - name: thread
            flags: -fsanitize=thread -fno-omit-frame-pointer
    env:
      CC: clang
      CXX: clang++
      CFLAGS: ${{ matrix.flags }}
      CXXFLAGS: ${{ matrix.flags }}
      LDFLAGS: ${{ matrix.flags }}
      # Only the undefined-behaviour sanitizer wants anything from the
      # runner. c/tests/test_compat1.c sets allocator_may_return_null for its
      # own ENOMEM case, through weak __asan_default_options() and
      # __tsan_default_options() hooks that reach that one executable; no
      # other test asks for a sanitizer option.
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4

      - name: Install libusb
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0-dev

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DKATHERINE_BUILD_CXX=ON
          -DKATHERINE_BUILD_EXAMPLES=ON
          -DKATHERINE_BUILD_PYTHON=OFF
          -DKATHERINE_TRANSPORT_USB=ON

      - name: Build
        run: cmake --build build --parallel

      # The whole suite, end-to-end tests included: a sanitizer's findings
      # are mostly in the paths that move data, and those only run there.
      # The timeout is generous because every one of them is slower under
      # instrumentation.
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 600
