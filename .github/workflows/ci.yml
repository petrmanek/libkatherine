name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The tree is formatted with clang-format 22 and .clang-format uses
      # keys unknown to older releases, so the runner's system formatter
      # cannot be relied on; pin the version the check is meaningful for.
      - name: Install clang-format
        run: |
          pip install 'clang-format==22.*'
          clang-format --version
      - name: Check formatting
        run: git ls-files '*.c' '*.h' '*.cpp' '*.hpp' | xargs clang-format --dry-run --Werror

  build:
    name: build (${{ matrix.os }}${{ matrix.compiler && format(', {0}', matrix.compiler) || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            python: true
          - os: ubuntu-latest
            compiler: clang
          - os: macos-latest
          - os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cython
        if: matrix.python
        run: pip install Cython

      - name: Set compiler
        if: matrix.compiler
        run: |
          echo "CC=${{ matrix.compiler }}" >> "$GITHUB_ENV"
          echo "CXX=${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}" >> "$GITHUB_ENV"

      # macOS configures only 127.0.0.1 on loopback; the end-to-end tests
      # host the emulated readout on a secondary address, so alias it.
      # Linux routes all of 127/8 to loopback and needs nothing.
      - name: Alias the emulator loopback address
        if: runner.os == 'macOS'
        run: sudo ifconfig lo0 alias 127.0.0.2 up

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DKATHERINE_BUILD_CXX=ON
          -DKATHERINE_BUILD_EXAMPLES=ON
          -DKATHERINE_BUILD_PYTHON=${{ matrix.python && 'ON' || 'OFF' }}

      - name: Build
        # --config is required by multi-config generators (Visual Studio on
        # the Windows runner); single-config generators ignore it.
        run: cmake --build build --parallel --config Release

      # Tests land in an upcoming commit; run ctest only once the build
      # tree actually registers tests.
      - name: Test
        if: ${{ hashFiles('build/CTestTestfile.cmake') != '' }}
        run: ctest --test-dir build --output-on-failure -C Release

      # Observation mode: the results are printed into the run log so that
      # tolerances can be calibrated from real runner data before any gate
      # is armed -- shared runners differ widely across hardware
      # generations, so a gate carried over from one machine would only
      # train everyone to ignore red. The ctest entries above already smoke
      # the benchmarks; this runs them at their full measurement duration.
      - name: Benchmark (observation)
        if: ${{ hashFiles('build/CTestTestfile.cmake') != '' }}
        shell: bash
        run: |
          for b in bench_decode bench_udp; do
            bin=$(find build \( -name "$b" -o -name "$b.exe" \) -type f | head -1)
            "$bin"
          done

  # Nothing built the documentation until now, so its whole configuration --
  # two doxygen runs, the manual-page prune, the macro predefines -- was
  # verified on one developer machine at one doxygen version, while the
  # declared minimum is far older and the Windows VM has no doxygen at all.
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DKATHERINE_BUILD_CXX=ON
          -DKATHERINE_BUILD_DOXYGEN=ON

      # The point of the job: the documentation has to build at all, on a
      # doxygen this project has never seen.
      - name: Build the documentation
        run: cmake --build build --target docs

      # The manual pages must be safe to install, and that is a property
      # rather than a number, so it is worth failing on. MAN_LINKS gives every
      # documented entity a page named after it alone, struct fields included,
      # which without the prune puts an abort.3 and a read.3 into man3 to
      # shadow the libc pages of those names. Every surviving page must carry
      # the library's own prefix.
      - name: Check the manual pages are namespaced
        shell: bash
        run: |
          pages=$(ls build/docs/man/man3 | wc -l)
          if [ "$pages" -eq 0 ]; then
            echo "no manual pages were generated"
            exit 1
          fi
          stray=$(ls build/docs/man/man3 | grep -vE '^(katherine|KATHERINE)' || true)
          if [ -n "$stray" ]; then
            echo "manual pages without the library prefix, which would shadow"
            echo "system pages of the same name:"
            echo "$stray"
            exit 1
          fi
          echo "$pages pages, all namespaced"

      # Observation mode, for the reason the benchmark step below gives: the
      # warning count moves with the doxygen version, so a number calibrated
      # on one machine would fail here for a reason that is not a regression.
      # Printed so a ceiling can be set from real runner data.
      - name: Warning count (observation)
        shell: bash
        run: |
          rm -f build/docs/docs.stamp build/docs/docs-man.stamp
          cmake --build build --target docs 2>&1 | grep -c 'warning:' || true
          doxygen --version

  # The build honors -DCMAKE_C_STANDARD / -DCMAKE_CXX_STANDARD from C11 and
  # C++11 up (see "Language standards" in the README). The two extremes
  # bracket the whole range: the strict oldest dialect catches code leaning
  # on GNU extensions or newer-standard features, the newest catches
  # constructs the later standards deprecate or repurpose.
  standards:
    name: standards (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: C11 strict
            cc: gcc
            cxx: g++
            c_standard: 11
            cxx_standard: 11
            extensions: OFF
          - name: C23/C++23
            cc: clang
            cxx: clang++
            c_standard: 23
            cxx_standard: 23
            extensions: ON
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_STANDARD=${{ matrix.c_standard }}
          -DCMAKE_CXX_STANDARD=${{ matrix.cxx_standard }}
          -DCMAKE_C_EXTENSIONS=${{ matrix.extensions }}
          -DKATHERINE_BUILD_CXX=ON
          -DKATHERINE_BUILD_EXAMPLES=ON
          -DKATHERINE_BUILD_PYTHON=OFF

      - name: Build
        run: cmake --build build --parallel

      # The unit label is enough here: the full suite (end-to-end tests
      # against the daemon) already runs in every leg of the build job, and
      # a language dialect cannot change what those cover.
      - name: Test
        run: ctest --test-dir build --output-on-failure -L unit
