name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The tree is formatted with clang-format 22 and .clang-format uses
      # keys unknown to older releases, so the runner's system formatter
      # cannot be relied on; pin the version the check is meaningful for.
      - name: Install clang-format
        run: |
          pip install 'clang-format==22.*'
          clang-format --version
      - name: Check formatting
        run: git ls-files '*.c' '*.h' '*.cpp' '*.hpp' | xargs clang-format --dry-run --Werror

  build:
    name: build (${{ matrix.os }}${{ matrix.compiler && format(', {0}', matrix.compiler) || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            python: true
          - os: ubuntu-latest
            compiler: clang
          - os: macos-latest
          - os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cython
        if: matrix.python
        run: pip install Cython

      - name: Set compiler
        if: matrix.compiler
        run: |
          echo "CC=${{ matrix.compiler }}" >> "$GITHUB_ENV"
          echo "CXX=${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}" >> "$GITHUB_ENV"

      # macOS configures only 127.0.0.1 on loopback; the end-to-end tests
      # host the emulated readout on a secondary address, so alias it.
      # Linux routes all of 127/8 to loopback and needs nothing.
      - name: Alias the emulator loopback address
        if: runner.os == 'macOS'
        run: sudo ifconfig lo0 alias 127.0.0.2 up

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DKATHERINE_BUILD_CXX=ON
          -DKATHERINE_BUILD_EXAMPLES=ON
          -DKATHERINE_BUILD_PYTHON=${{ matrix.python && 'ON' || 'OFF' }}

      - name: Build
        # --config is required by multi-config generators (Visual Studio on
        # the Windows runner); single-config generators ignore it.
        run: cmake --build build --parallel --config Release

      # Tests land in an upcoming commit; run ctest only once the build
      # tree actually registers tests.
      - name: Test
        if: ${{ hashFiles('build/CTestTestfile.cmake') != '' }}
        run: ctest --test-dir build --output-on-failure -C Release

      # Observation mode: the results are printed into the run log so that
      # tolerances can be calibrated from real runner data before any gate
      # is armed -- shared runners differ widely across hardware
      # generations, so a gate carried over from one machine would only
      # train everyone to ignore red. The ctest entries above already smoke
      # the benchmarks; this runs them at their full measurement duration.
      - name: Benchmark (observation)
        if: ${{ hashFiles('build/CTestTestfile.cmake') != '' }}
        shell: bash
        run: |
          for b in bench_decode bench_udp; do
            bin=$(find build \( -name "$b" -o -name "$b.exe" \) -type f | head -1)
            "$bin"
          done

  # The build honors -DCMAKE_C_STANDARD / -DCMAKE_CXX_STANDARD from C11 and
  # C++11 up (see "Language standards" in the README). The two extremes
  # bracket the whole range: the strict oldest dialect catches code leaning
  # on GNU extensions or newer-standard features, the newest catches
  # constructs the later standards deprecate or repurpose.
  standards:
    name: standards (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: C11 strict
            cc: gcc
            cxx: g++
            c_standard: 11
            cxx_standard: 11
            extensions: OFF
          - name: C23/C++23
            cc: clang
            cxx: clang++
            c_standard: 23
            cxx_standard: 23
            extensions: ON
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_STANDARD=${{ matrix.c_standard }}
          -DCMAKE_CXX_STANDARD=${{ matrix.cxx_standard }}
          -DCMAKE_C_EXTENSIONS=${{ matrix.extensions }}
          -DKATHERINE_BUILD_CXX=ON
          -DKATHERINE_BUILD_EXAMPLES=ON
          -DKATHERINE_BUILD_PYTHON=OFF

      - name: Build
        run: cmake --build build --parallel

      # The unit label is enough here: the full suite (end-to-end tests
      # against the daemon) already runs in every leg of the build job, and
      # a language dialect cannot change what those cover.
      - name: Test
        run: ctest --test-dir build --output-on-failure -L unit
